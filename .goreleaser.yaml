# GoReleaser config for kode-gopher, modeled on go-steer/core-agent's
# and go-steer/mast's. Cross-compiles cmd/kode-gopher, packs tar.gz
# archives, writes checksums.txt, signs it with Sigstore keyless
# (GitHub Actions OIDC -> Fulcio -> Rekor), and publishes the GitHub
# Release. .github/workflows/release.yml drives it on a v* tag push and
# supplies the notes from CHANGELOG.md via --release-notes. See
# docs/release-process.md.
#
# Local check (no publish, no signing; signing needs a CI OIDC token):
#   goreleaser check
#   goreleaser release --snapshot --clean --skip=publish,sign
version: 2

project_name: kode-gopher

builds:
  - id: kode-gopher
    main: ./cmd/kode-gopher
    binary: kode-gopher
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    # Keep the package path in sync with internal/version/version.go.
    # {{.Tag}} is the raw tag (v0.1.0), the same shape `go install
    # module@v0.1.0` reports, so every build flavor agrees.
    ldflags:
      - -s -w
      - -X github.com/gke-demos/kode-gopher/internal/version.Version={{.Tag}}
      - -X github.com/gke-demos/kode-gopher/internal/version.Commit={{.FullCommit}}
      - -X github.com/gke-demos/kode-gopher/internal/version.Date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: kode-gopher
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Sign the checksum file only: it attests every archive transitively.
# Produces checksums.txt.sigstore.json, a Sigstore bundle holding the
# signature, certificate and transparency-log entry. cosign 3 (from
# cosign-installer v4) writes only bundles: its old --output-signature
# and --output-certificate flags fail, which broke the v0.1.0 release.
# Needs cosign on PATH and an OIDC token (release.yml grants
# id-token: write).
signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  github:
    owner: gke-demos
    name: kode-gopher
  # v0.2.0-rc.1 and the like are marked Pre-release automatically.
  prerelease: auto
  # A re-run against an existing tag replaces the Release body and
  # assets instead of failing.
  mode: replace

# GoReleaser's own git-log changelog is off in effect, but deliberately
# NOT via `changelog: disable: true`. GoReleaser loads the
# --release-notes file inside the changelog pipe, so disabling the pipe
# silently drops our CHANGELOG.md notes too: mast published v0.2.0 and
# v0.3.0 with empty bodies that way, and core-agent works around the
# same thing by editing the body after publishing. With the pipe on,
# --release-notes short-circuits it before any git-log changelog is
# generated. release.yml always passes --release-notes and then checks
# the published body is not empty.
