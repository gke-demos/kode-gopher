# Sandbox egress by hostname, on GKE. The base template's network
# policy allows DNS and every public IP; this keeps DNS and lets an
# FQDNNetworkPolicy (GKE Dataplane V2, --enable-fqdn-network-policy)
# allow port 443 to an allowlist of hostnames instead.
#
# The two policies are OR'd: a connection is allowed if either allows
# it. So the template's public rule has to go, or the allowlist would
# add nothing. The test op fails the build if the base's rules change
# shape, rather than removing the wrong one.
#
# Filtering is by IP at connection time, from the cluster DNS answers
# for the listed names. Google APIs share front-end IPs, so allowing
# *.googleapis.com allows every Google API behind them, including other
# projects' buckets. Stopping that is VPC Service Controls' job.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - fqdnnetworkpolicy.yaml

patches:
  - target:
      kind: SandboxTemplate
      name: go-runtime-template
    patch: |-
      - op: test
        path: /spec/networkPolicy/egress/1/to/0/ipBlock/cidr
        value: 0.0.0.0/0
      - op: remove
        path: /spec/networkPolicy/egress/1
