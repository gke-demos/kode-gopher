# What sandboxes may reach, besides DNS. scripts/deploy-gke-server.sh
# appends the cluster region's GKE control-plane DNS endpoints
# (*.<region>.gke.goog) and EGRESS_ALLOW.
#
# A pattern matches exactly one label: *.googleapis.com matches
# storage.googleapis.com, not a.b.googleapis.com or googleapis.com.
apiVersion: networking.gke.io/v1alpha1
kind: FQDNNetworkPolicy
metadata:
  name: kode-gopher-sandbox-egress
spec:
  podSelector:
    matchLabels:
      sandbox: kode-gopher-sandbox
  egress:
    - matches:
        # Every Google Cloud API, and oauth2.googleapis.com for a
        # forwarded ADC file's token refresh.
        - pattern: "*.googleapis.com"
        # go mod tidy, for imports outside the precompiled modules.
        - name: proxy.golang.org
        - name: sum.golang.org
      ports:
        - protocol: TCP
          port: 443
