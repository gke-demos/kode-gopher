# In-cluster kode-gopher on GKE (docs/design-in-cluster.md): everything
# in manifests/overlays/gke (sandbox template, warm pool, router), plus
# the kode-gopher server behind a Gateway:
#   - rbac.yaml           KSA kode-gopher, Role and RoleBinding
#   - deployment.yaml     Deployment and Service, --auth=static
#   - gateway.yaml        Gateway, HTTPRoute, health check, timeout
#   - networkpolicy.yaml  kode-gopher's ingress and egress
#
# Use scripts/deploy-gke-server.sh rather than applying this directly:
# it fills in the API server address in networkpolicy.yaml, creates the
# Secrets, the static IP and the certificate, and can pin the image.
# The gke-server-oauth overlay, on top of this one, switches to Google
# sign-in.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: codemode

resources:
  - ../gke
  - rbac.yaml
  - deployment.yaml
  - gateway.yaml
  - networkpolicy.yaml
