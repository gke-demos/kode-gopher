# kode-gopher's identity in the cluster (docs/design-in-cluster.md >
# RBAC and identity): claims and sandboxes in its own namespace only.
# No port-forward (it dials sandboxes by their Service) and no
# cluster-wide grants. Users need no Kubernetes RBAC at all.
#
# The same KSA is kode-gopher's Google identity through Workload
# Identity Federation: under --auth=static, snippets run as
#   principal://iam.googleapis.com/projects/<number>/locations/global/workloadIdentityPools/<project>.svc.id.goog/subject/ns/codemode/sa/kode-gopher
# and get only what that principal is granted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kode-gopher
  labels:
    app: kode-gopher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kode-gopher
  labels:
    app: kode-gopher
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kode-gopher
  labels:
    app: kode-gopher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kode-gopher
subjects:
  - kind: ServiceAccount
    name: kode-gopher
