# ComputeClass for sandbox pods: C3 first, then C4, N4 or N2.
#
# Autopilot's default class runs gVisor pods on ek-standard (E2-class)
# nodes, where a warm GCS build takes ~6-8 s. The same build on C3 takes
# ~2.2 s. That is CPU under gVisor, not I/O; see docs/decisions.md >
# Slice 7: fast path. Unlike the built-in Performance class (one node
# per pod), a custom class bin-packs pods onto the nodes it creates.
# Fallbacks cover stockouts (N4 was out in us-central1-c on
# 2026-09-29). whenUnsatisfiable: ScaleUpAnyway keeps sandboxes
# schedulable, if slower, when none of them can be had.
#
# Cluster-scoped, so not namespaced by kustomize.
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: kode-gopher-sandbox
spec:
  priorities:
    - machineFamily: c3
    - machineFamily: c4
    - machineFamily: n4
    - machineFamily: n2
  nodePoolAutoCreation:
    enabled: true
  whenUnsatisfiable: ScaleUpAnyway
