# SandboxWarmPool the kode-gopher CLI / MCP server claims from.
#
# In agent-sandbox v1beta1 a SandboxClaim names a warm pool, not a
# template (spec.warmPoolRef, required). With a ready sandbox in the
# pool, a claim adopts it in seconds. With none, the controller
# cold-starts one from the pool's template, so the pool is required
# even at replicas 0.
#
# One replica here (kind). The GKE overlay raises it to 2 so the
# smoketest can run its files back to back without waiting for
# replenishment.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: go-runtime-pool
spec:
  replicas: 1
  sandboxTemplateRef:
    name: go-runtime-template
  updateStrategy:
    type: OnReplenish
