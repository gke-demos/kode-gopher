# sandbox-router, one per namespace that runs claims.
#
# The agent-sandbox Go client reaches sandboxes by port-forwarding to
# a Service named `sandbox-router-svc` in the SandboxClaim's own
# namespace. It doesn't search cluster-wide. The router forwards each
# request to <sandbox>.<namespace>.svc:8888 using the X-Sandbox-*
# headers the client sets.
#
# Image: upstream's Go router (sandbox-router/ in agent-sandbox v1.0),
# published to registry.k8s.io. Same on kind and GKE, so neither needs
# a locally built router. Adapted from sandbox-router/deploy/ with
# these differences:
#   - DNS-only (--cache-enabled=false). The Pod-IP cache needs a
#     cluster-wide pods get/list/watch grant; per-request DNS for a
#     handful of sandboxes doesn't. With no API access needed, the
#     router mounts no KSA token.
#   - --response-header-timeout and --proxy-timeout at 300s. The
#     in-pod server writes headers only when the command exits, so the
#     default 30s header timeout would 502 any build or run longer than
#     that. 300s matches internal/sandbox's default Execute timeout.
#   - Keeps the `app: sandbox-router` label. The SandboxTemplate's
#     networkPolicy admits sandbox ingress from pods with that label.
apiVersion: v1
kind: Service
metadata:
  name: sandbox-router-svc
  labels:
    app: sandbox-router
spec:
  type: ClusterIP
  selector:
    app: sandbox-router
  ports:
    - name: proxy
      protocol: TCP
      port: 8080
      targetPort: proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-router
  labels:
    app: sandbox-router
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sandbox-router
  template:
    metadata:
      labels:
        app: sandbox-router
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: sandbox-router
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 45
      containers:
        - name: sandbox-router
          image: registry.k8s.io/agent-sandbox/sandbox-router-go:v1.0.4
          imagePullPolicy: IfNotPresent
          args:
            - --http-bind-address=:8080
            - --metrics-bind-address=:9090
            - --health-probe-bind-address=:8081
            - --cluster-domain=cluster.local
            - --proxy-timeout=300s
            - --response-header-timeout=300s
            - --upstream-max-retries=3
            - --cache-enabled=false
          ports:
            - name: proxy
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: healthz
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 1
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
