name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: make prompts-check
      # The GKE overlay must pin the sandbox image the current sources
      # build to; sandbox-image.yml publishes it on merge.
      - run: make sandbox-pin-check
