# Builds the in-cluster server image (server/Dockerfile) for linux/amd64
# and linux/arm64 and publishes it to ghcr.io/gke-demos/kode-gopher/server:
#   - v* tags:   :X.Y.Z, :X.Y, :X, and :latest for non-prerelease tags
#   - main:      :main and :main-<short sha>
# Pull requests build amd64 without pushing, to catch a broken Dockerfile.
#
# Images are signed by digest with Sigstore keyless signing. Verify with:
#   cosign verify ghcr.io/gke-demos/kode-gopher/server:<tag> \
#     --certificate-identity-regexp '^https://github.com/gke-demos/kode-gopher/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: server-image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - docs/**
  pull_request:
    paths:
      - server/**
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - .github/workflows/server-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push to GHCR
  id-token: write   # cosign keyless signing

env:
  IMAGE: ghcr.io/gke-demos/kode-gopher/server

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR shows a multi-arch image's description from the index
      # annotations, so emit them at both levels.
      - name: Tags, labels and annotations
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=ref,event=branch,enable=${{ github.ref_type != 'tag' }}
            type=sha,prefix=main-,format=short,enable=${{ github.ref_name == 'main' && github.ref_type != 'tag' }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=kode-gopher-server
            org.opencontainers.image.description=kode-gopher MCP server for in-cluster use: runs Go snippets in agent-sandbox sandboxes as the signed-in user.
          annotations: |
            org.opencontainers.image.title=kode-gopher-server
            org.opencontainers.image.description=kode-gopher MCP server for in-cluster use: runs Go snippets in agent-sandbox sandboxes as the signed-in user.

      # Same stamping as .goreleaser.yaml. The build context has no .git,
      # so without it the binary wouldn't know its commit. Untagged
      # builds keep Version=dev.
      - name: Version stamp
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          pkg=github.com/gke-demos/kode-gopher/internal/version
          flags="-X ${pkg}.Commit=${GITHUB_SHA} -X ${pkg}.Date=$(git log -1 --format=%cI)"
          if [ "$REF_TYPE" = tag ]; then
            flags="-X ${pkg}.Version=${REF_NAME} ${flags}"
          fi
          echo "ldflags=${flags}" >> "$GITHUB_OUTPUT"

      # The builder stage cross-compiles, so arm64 needs no QEMU.
      - name: Build (and push unless a pull request)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            LDFLAGS=${{ steps.version.outputs.ldflags }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.2  # no floating major tag upstream

      # By digest: tags move, and one signature covers every tag on it.
      - name: Sign
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
