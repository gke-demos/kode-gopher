# Builds the sandbox image and, on main, publishes it to GHCR under the
# content-derived tag from scripts/sandbox-image-tag.sh (plus :latest).
# The GKE overlay pins that tag; ci.yml fails PRs whose pin is stale.
# Pull requests build without pushing, to catch a broken Dockerfile.
name: sandbox-image

on:
  push:
    branches: [main]
    paths:
      - sandbox/**
      - cmd/sandbox-server/**
      - internal/prewarm/**
      - scripts/sandbox-image-tag.sh
      - .github/workflows/sandbox-image.yml
  pull_request:
    paths:
      - sandbox/**
      - cmd/sandbox-server/**
      - internal/prewarm/**
      - scripts/sandbox-image-tag.sh
      - .github/workflows/sandbox-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push to GHCR
  id-token: write   # cosign keyless signing

env:
  IMAGE: ghcr.io/gke-demos/kode-gopher/sandbox
  DESCRIPTION: kode-gopher sandbox image - Go toolchain, prewarmed module and build caches, and sandbox-server.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compute tag
        id: tag
        run: echo "tag=$(scripts/sandbox-image-tag.sh)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags are content-derived, so an existing tag is already the right
      # image (e.g. after a revert): just move :latest to it.
      - name: Check for existing image
        id: exists
        if: github.event_name != 'pull_request'
        run: |
          if docker buildx imagetools inspect "$IMAGE:${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Retag existing image as latest
        if: steps.exists.outputs.exists == 'true'
        run: docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:${{ steps.tag.outputs.tag }}"

      - name: Build (and push on main)
        id: build
        if: steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: sandbox/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=kode-gopher-sandbox
            org.opencontainers.image.description=${{ env.DESCRIPTION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          annotations: |
            org.opencontainers.image.description=${{ env.DESCRIPTION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # Images built before signing was added stay unsigned; each new
      # content tag is signed once, when it's built. Verify with
      #   cosign verify ghcr.io/gke-demos/kode-gopher/sandbox:<tag> \
      #     --certificate-identity-regexp '^https://github.com/gke-demos/kode-gopher/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Install cosign
        if: github.event_name != 'pull_request' && steps.exists.outputs.exists != 'true'
        uses: sigstore/cosign-installer@v4.1.2  # no floating major tag upstream

      - name: Sign
        if: github.event_name != 'pull_request' && steps.exists.outputs.exists != 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
